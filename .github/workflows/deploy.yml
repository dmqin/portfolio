name: Next.js CI/CD

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t nextjs-cicd .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::350869994103:role/AmazonEC2ContainerRegistryPowerUser
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag nextjs-cicd:latest 350869994103.dkr.ecr.ap-southeast-1.amazonaws.com/nextjs-cicd:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push 350869994103.dkr.ecr.ap-southeast-1.amazonaws.com/nextjs-cicd:${{ github.sha }}

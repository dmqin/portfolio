name: Next.js CI/CD
on:
push:
branches:- main
jobs:
build:
runs-on: ubuntu-latest
steps:- name: Checkout repository
uses: actions/checkout@v4- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 22- name: Install dependencies
run: npm ci- name: Build Next.js
run: npm run build- name: Build Docker image
run: docker build -t nextjs-cicd .
